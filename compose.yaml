name: pressurecooker
x-execution-env: &execution-env
  JMETER_REDIS_ADDR: ${JMETER_REDIS_ADDR:-host.docker.internal:6379}
  JMETER_REDIS_PASSWORD_FILE: /run/platform/redis-password
  JMETER_REDIS_DB: ${JMETER_REDIS_DB:-0}
  JMETER_REDIS_PREFIX: ${JMETER_REDIS_PREFIX:-jmeter:v2}
  JMETER_ARCHIVE_ENDPOINT: http://minio:9000
  JMETER_ARCHIVE_BUCKET: jmeter-reports
  JMETER_ARCHIVE_ACCESS_KEY_FILE: /run/platform/minio-access-key
  JMETER_ARCHIVE_SECRET_KEY_FILE: /run/platform/minio-secret-key
  JMETER_ARCHIVE_REGION: us-east-1
  JMETER_WORK_DIR: /work
  JMETER_COMMON_PROPERTIES: /opt/cluster/conf/common.properties
  PRESSURECOOKER_MANAGER_URL: ${PRESSURECOOKER_MANAGER_URL:-http://manager:8080}

x-node: &node
  image: ${JMETER_IMAGE:-pressurecooker-platform:local}
  pull_policy: never
  user: "${JMETER_UID:-1000}:${JMETER_GID:-1000}"
  command: [agent]
  depends_on:
    minio: {condition: service_healthy}
  read_only: true
  restart: unless-stopped
  tmpfs: ["/tmp:size=256m,mode=1777"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  networks: [jmeter]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
  healthcheck:
    test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8082; printf \"GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; cat <&3 | grep -Eq '\"ready\"[[:space:]]*:[[:space:]]*true'"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 30s

x-manager: &manager
  image: ${JMETER_MANAGER_IMAGE:-pressurecooker-manager:local}
  pull_policy: never
  user: "${JMETER_UID:-1000}:${JMETER_GID:-1000}"
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=256m,mode=1777"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  networks: [jmeter]
  extra_hosts: ["host.docker.internal:host-gateway"]
  cpus: 1.0
  mem_limit: 1g
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
  volumes:
    - ./runtime/state:/state
    - ./runtime/results:/results
    - ./plans:/plans
    - ./runtime/secrets/platform:/run/platform:ro
    - ./runtime/backups:/backup
    - ./runtime/restore:/restore
  healthcheck:
    test: [CMD, /app/bin/jmeter-manager, health]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 20s

services:

  controller-a:
    <<: *node
    user: "0:0"
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, KILL]
    hostname: controller-a
    cpus: 1.0
    mem_limit: 2g
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    environment:
      <<: *execution-env
      JMETER_AGENT_ID: controller-a
      PRESSURECOOKER_NODE_NAME: PressureCooker-Core-1
      JMETER_AGENT_ROLE: controller
      JMETER_CLUSTER_ID: cluster-7ba589c761abd60ec4522bf2
      JMETER_AGENT_TOKEN_FILE: /run/platform/agent-token
      JMETER_AGENT_STATE_DIR: /work/state
      JMETER_PLANS_DIR: /plans
      JMETER_RESULTS_DIR: /work/tasks
      JMETER_RMI_PROPERTIES: /run/jmeter-rmi/rmi.properties
      JMETER_ENGINE_HEAP: -Xms256m -Xmx1024m
    volumes:
      - ./runtime/secrets/platform/agent-token:/run/platform/agent-token:ro
      - ./runtime/secrets/platform/redis-password:/run/platform/redis-password:ro
      - ./runtime/secrets/platform/minio-access-key:/run/platform/minio-access-key:ro
      - ./runtime/secrets/platform/minio-secret-key:/run/platform/minio-secret-key:ro
      - ./runtime/secrets/rmi-jvm:/run/jmeter-rmi:ro
      - ./runtime/data/controller-a:/data:ro
      - ./runtime/work/controller-a:/work

    build:
      context: .
      args:
        JDK_BASE_IMAGE: ${JDK_BASE_IMAGE:-mcr.microsoft.com/openjdk/jdk:21-ubuntu}

